<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lamp Bridge</title>
<style>
:root { --bg: #f4f1ea; --surface: #fffdf8; --line: #e2dccf; --text: #24211c; --muted: #7a7266; --accent: #d9822b; --on: #3f8f63; }
@media (prefers-color-scheme: dark) { :root { --bg: #16181c; --surface: #1f2228; --line: #343943; --text: #ece8e1; --muted: #9a958c; --accent: #f0a050; --on: #6cc391; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.8rem; margin: 4px 0 2px; }
h2 { font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; hyphens: auto; }
#msg { color: var(--muted); font-size: .85rem; min-height: 1.3em; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.head > div:first-child { min-width: 0; }
.state { font-size: .8rem; color: var(--muted); }
button { font: inherit; font-weight: 650; min-height: 42px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; }
button.active { background: var(--on); border-color: transparent; color: #fff; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.scenes button { flex: 1 1 140px; }
label { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; margin: 12px 0 2px; }
label output { color: var(--muted); font-weight: 500; }
input[type=range] { width: 100%; margin: 4px 0; accent-color: var(--accent); }
.mode { margin-top: 10px; }
.mode button { min-height: 34px; padding: 4px 12px; font-size: .85rem; }
footer { text-align: center; color: var(--muted); font-size: .8rem; }
footer a { color: inherit; }
</style></head>
<body><main>
<h1>Lamps</h1>
<div id="msg">Loading…</div>
<div id="scenes" class="card"><div class="row scenes"></div>
  <div class="row" style="margin-top:8px"><button id="store">Save current as scene…</button></div></div>
<div id="lamps"></div>
<div class="card row"><button class="primary" data-all="0">All off</button><button data-all="1">All on</button></div>
<footer><a href="/setup">Bridge settings</a> · <a href="/k">Kindle page</a></footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let lamps = [], scenes = [], presets = [], timeSent = false, building = '';

async function call(path, body) {
  const res = await fetch(path, body === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(body)});
  const text = await res.text();
  if (!res.ok) throw new Error(text);
  return text;
}
function parse(text) {
  const s = {lamps: [], scenes: [], presets: [], bridge: '-', message: '', time: true};
  for (const row of text.split('\n')) {
    const f = row.split('\t');
    if (f[0] === 'bridge') { s.bridge = f[1]; s.message = f[2]; }
    else if (f[0] === 'time') s.time = f[1] === '1';
    else if (f[0] === 'lamp') s.lamps.push({id: f[1], name: f[2], on: f[3], b: +f[4], mode: f[5], k: +f[6], h: +f[7], s: +f[8]});
    else if (f[0] === 'scene') s.scenes.push({i: f[1], name: f[2]});
    else if (f[0] === 'preset') s.presets.push({i: f[1], name: f[2]});
  }
  return s;
}
function build() {
  $('lamps').replaceChildren(...lamps.map(l => {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.id = l.id;
    card.innerHTML = `<div class="head"><div><h2></h2><div class="state"></div></div>
      <div class="row"><button data-on="1">On</button><button data-on="0">Off</button></div></div>
      <label>Brightness <output class="o-b"></output></label><input class="b" type="range" min="1" max="100">
      <div class="row mode"><button data-mode="w">White</button><button data-mode="c">Colour</button></div>
      <div class="white"><label>White <output class="o-k"></output></label><input class="k" type="range" min="2200" max="6600" step="50"></div>
      <div class="colour"><label>Hue <output class="o-h"></output></label><input class="h" type="range" min="0" max="360">
      <label>Saturation <output class="o-s"></output></label><input class="s" type="range" min="0" max="100"></div>
      <div class="row mode presets"></div>`;
    card.querySelector('.presets').replaceChildren(...presets.map(p =>
      Object.assign(document.createElement('button'), {textContent: p.name, dataset: {preset: p.i}})));
    card.querySelector('h2').textContent = l.name;
    return card;
  }));
}
function show(text) {
  const s = parse(text);
  lamps = s.lamps; scenes = s.scenes; presets = s.presets;
  const ids = lamps.map(l => l.id).join() + '|' + presets.map(p => p.name).join();
  if (ids !== building) { building = ids; build(); }
  for (const l of lamps) {
    const card = document.querySelector(`.card[data-id="${l.id}"]`), q = c => card.querySelector('.' + c);
    q('state').textContent = l.on === '1' ? 'On' : l.on === '0' ? 'Off' : 'Unknown';
    card.querySelector('[data-on="1"]').classList.toggle('active', l.on === '1');
    card.querySelector('[data-on="0"]').classList.toggle('active', l.on === '0');
    for (const [c, v] of [['b', l.b], ['k', l.k], ['h', l.h], ['s', l.s]]) {
      if (document.activeElement !== q(c)) q(c).value = v; // never fight a finger on the slider
    }
    q('o-b').textContent = l.b + ' %'; q('o-k').textContent = l.k + ' K'; q('o-h').textContent = l.h + '°'; q('o-s').textContent = l.s + ' %';
    q('white').hidden = l.mode !== 'w'; q('colour').hidden = l.mode !== 'c';
    card.querySelector('[data-mode="w"]').classList.toggle('active', l.mode === 'w');
    card.querySelector('[data-mode="c"]').classList.toggle('active', l.mode === 'c');
    q('h').style.background = `hsl(${l.h} ${l.s}% 50%)`;
  }
  const box = $('scenes').querySelector('.row');
  if (box.dataset.names !== scenes.map(x => x.name).join('\n')) {
    box.dataset.names = scenes.map(x => x.name).join('\n');
    box.replaceChildren(...scenes.map(x => Object.assign(document.createElement('button'), {textContent: x.name, onclick: () => send('/api/scene', {i: x.i})})));
  }

  $('msg').textContent = (s.bridge === '-' ? 'Not connected to the lamps' : 'Connected via ' + s.bridge) + (s.message ? ' · ' + s.message : '');
  if (!s.time && !timeSent) { timeSent = true; call('/api/time', {t: Date.now()}).catch(() => {}); }
}
async function send(path, body) {
  try { show(await call(path, body)); } catch (e) { $('msg').textContent = 'Error: ' + e.message; }
}
async function refresh() {
  try { show(await call('/api/state')); } catch (e) { $('msg').textContent = 'Bridge not reachable'; }
}
// Sliders: send while dragging, at most every 250 ms, and the final value on release.
const timers = new Map();
function slider(input) {
  const card = input.closest('.card'), id = card.dataset.id, c = input.className;
  const body = c === 'b' ? {id, b: input.value} : c === 'k' ? {id, k: input.value}
    : {id, h: card.querySelector('.h').value, s: card.querySelector('.s').value};
  clearTimeout(timers.get(id + c));
  timers.set(id + c, setTimeout(() => send('/api/lamp', body), 250));
}
document.addEventListener('input', e => { if (e.target.type === 'range') slider(e.target); });
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const card = b.closest('.card[data-id]');
  if (b.dataset.all) send('/api/all', {on: b.dataset.all});
  else if (b.dataset.on) send('/api/lamp', {id: card.dataset.id, on: b.dataset.on});
  else if (b.dataset.preset) send('/api/lamp', {id: card.dataset.id, preset: b.dataset.preset});
  else if (b.id === 'store') {
    const name = prompt('Name for a scene with the lamps as they are now:');
    if (name) send('/api/scene/store', {name});
  }
  else if (b.dataset.mode === 'w') send('/api/lamp', {id: card.dataset.id, k: card.querySelector('.k').value});
  else if (b.dataset.mode === 'c') send('/api/lamp', {id: card.dataset.id, h: card.querySelector('.h').value, s: card.querySelector('.s').value});
});
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
</script>
</body></html>
