; Lamp bridge: ESP32 (WROOM-32) between home Wi-Fi and the AwoX/EGLO BLE mesh.
;   pio run -t upload       build and flash (board on USB)
;   python3 setup.py        Wi-Fi and mesh credentials over USB (asked for, never stored on the Mac)
;   make -C test            host tests; make -C test serve: pages with simulated lamps
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 1.9 MB app (NimBLE + Wi-Fi + TLS) and a small LittleFS for lamps.json and the scenes.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles =
    web/index.html
    web/kindle.html
    web/setup.html
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
